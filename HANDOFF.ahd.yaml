meta:
  purpose: >
    Coordinate four parallel git-worktree sessions each fixing one verified,
    causally-coupled bug pair in a Streamlit number-guessing game, review each
    diff before commit, merge all four back to main in order, then dispatch a
    5th session to expand test coverage once logic_utils.py has no stubs left.
  situation_class: [BUILD]
  handoff_state: BLOCKED_ON_PRINCIPAL
  next_agent_first_action: plan.M4
  prior_agent_actions:
    - Catalogued 10 distinct bugs in app.py/logic_utils.py via direct play and code reading
    - Marked 8 "# FIXME: Logic breaks here" comments across 4 coupled bug-locations in app.py; wrote BUGFIX_PLAN.md with one dispatch prompt per bug
    - Dispatched four fresh Claude sessions, each creating its own git worktree + branch off commit 505caf9
    - Wrote CLAUDE.md (uv-only venv policy with why, architecture, required deliverables, the parallel-bugfix-worktree convention, and the always-present-git-commands convention)
    - Corrected drift between BUGFIX_PLAN.md's original prescriptions and what sessions actually delivered (a broken regression test replaced, a pytest command typo fixed, filtered-vs-full test invocations corrected)
    - Independently verified Bug A's win-rate math (2^k−1 formula) and validated its live reversal from a recommended Option B to the session's own Option A
  custom_sections: [bug_worktrees]
  do_not: >
    Do not approve or merge any bugfix branch whose worktree hasn't both (a)
    handed the PRINCIPAL the exact unfiltered pytest + streamlit commands and
    (b) had its live check actually run — self-reports of "tests pass" are not
    a substitute, per this session's own established pattern of independently
    verifying rather than trusting sibling-session self-reports at face value.

