decisions:
  - id: DR1
    question: "How to parallelize fixing 4 independent-ish bugs without agents clobbering each other?"
    verdict: USE_ONE_WORKTREE_PER_BUG
    chosen_option: One git worktree + branch + fresh Claude session per bug, coordinated via a written plan file (BUGFIX_PLAN.md), never live inter-session messaging
    rationale:
      - ListAgents does not reliably show sibling sessions in either direction — confirmed empirically this session, not assumed
      - Session "names" collide (3 of 4 siblings auto-named identically to this coordinator session) — names are not a reliable address either
      - Worktrees give structural isolation: git status in one worktree cannot see another's uncommitted changes, so a coordinator-level commit can never accidentally sweep in bugfix-specific changes
    alternatives_rejected: [single sequential session fixing all 4 bugs, shared working tree with manual turn-taking]
    reversal_conditions: [if a future harness makes cross-session SendMessage reliably bidirectional, direct coordination becomes viable again]
    confidence: HIGH
    decided_by: agent+confirmed
    decided_on: "2026-10-05"
  - id: DR2
    question: "What should Hard difficulty's range/attempts be, given its range (1-50) was narrower than Normal's (1-100) despite being the harder difficulty?"
    verdict: HARD_RANGE_1_100_ATTEMPTS_5
    chosen_option: Tie Hard's range to Normal's (1,100); leave attempts at 5 (unchanged)
    rationale:
      - Verified independently (2^k−1 formula, matches the sibling session's brute-force trial counts exactly) — Option B's 62%-today baseline is measured on a game with inverted hints, wrong attempt-seed, and out-of-range secrets, so it's not a meaningful reference for what Hard "should" feel like
      - Matches the original brief's own framing, which already called 5 attempts correct — keeps this branch scoped to only the range bug actually diagnosed
      - The new DIFFICULTY_SETTINGS dict makes retuning attempts later a one-line change, once B/C/D are merged and the game is actually playable
    alternatives_rejected: ["Option B: range (1,100), attempts 6 — this session's own initial recommendation, reversed after the above argument surfaced"]
    reversal_conditions: [a human playtest of the fully-fixed game shows Hard at 31% perfect-play win rate is undesirable]
    supersedes: null
    confidence: HIGH
    decided_by: PRINCIPAL
    decided_on: "2026-10-06"
  - id: DR3
    question: "Should check_guess return (outcome, message) or just outcome?"
    verdict: RETURN_BARE_OUTCOME_STRING
    chosen_option: check_guess returns only "Win"/"Too High"/"Too Low"; message text lives in app.py's OUTCOME_MESSAGES, keyed by outcome
    rationale:
      - tests/test_game_logic.py already asserts a bare string (check_guess(50,50) == "Win") — the function must match the existing test contract, not the other way around
      - Separating decision from display text is also what let the even-attempt str(secret) coercion and its except-TypeError fallback be deleted outright once the root cause was removed
    alternatives_rejected: ["keep the tuple return and update the tests instead — rejected, tests represent the grading contract"]
    reversal_conditions: [none expected — this is a contract fix, not a judgment call]
    confidence: HIGH
    decided_by: agent+confirmed
    decided_on: "2026-10-05"
  - id: DR4
    question: "Should update_score's 'Too High' keep its +5/-5 attempt-parity alternation?"
    verdict: FLATTEN_TOO_HIGH_TO_FLAT_PENALTY
    chosen_option: "Too High" always costs -5, same as "Too Low" — no parity dependence
    rationale:
      - No apparent design reason surfaced for rewarding a wrong guess half the time, and "Too Low" never got the same treatment — an asymmetry between two instances of "a wrong guess"
    alternatives_rejected: ["keep the alternation as an intentional quirk — no rationale for it was ever found"]
    reversal_conditions: [if Danny states this alternation was actually intentional design, not a bug]
    confidence: MEDIUM
    decided_by: agent+confirmed
    decided_on: "2026-10-05"
  - id: DR5
